name: RomeoDailyLedger
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.romeoke.RomeoDailyLedger
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 5
targets:
  RomeoDailyLedger:
    type: application
    platform: macOS
    sources: [RomeoDailyLedger]
    settings:
      base:
        PRODUCT_NAME: Romeo Daily Ledger
        PRODUCT_MODULE_NAME: RomeoDailyLedger
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: RomeoDailyLedger/Resources/Info.plist
      properties:
        CFBundleDisplayName: Romeo Daily Ledger
        CFBundleName: 罗密欧每日记账
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: "14.0"
  RomeoDailyLedgerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [RomeoDailyLedgerTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.romeoke.RomeoDailyLedgerTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Romeo Daily Ledger.app/Contents/MacOS/Romeo Daily Ledger
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: RomeoDailyLedger
  RomeoDailyLedgerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [RomeoDailyLedgerUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.romeoke.RomeoDailyLedgerUITests
    dependencies:
      - target: RomeoDailyLedger
schemes:
  RomeoDailyLedger:
    build:
      targets:
        RomeoDailyLedger: all
        RomeoDailyLedgerTests: [test]
        RomeoDailyLedgerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: RomeoDailyLedgerTests
        - name: RomeoDailyLedgerUITests
    archive:
      config: Release
